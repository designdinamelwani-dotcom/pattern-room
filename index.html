document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

input:disabled,select:disabled,textarea:disabled{opacity:1;-webkit-text-fill-color:var(--pr-ink,#1B1A17);cursor:default}\n*{box-sizing:border-box}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"min-height:100vh; display:flex; flex-direction:column\">\n  <header style=\"height:56px; flex-shrink:0; display:flex; align-items:center; gap:14px; padding:0 {{ L.hPad }}; border-bottom:1px solid var(--pr-line,#DCD6C8); background:var(--pr-surf,#FBFAF6); position:sticky; top:0; z-index:30; min-width:0\">\n    <div sc-camel-on-click=\"{{ goHome }}\" style=\"display:flex; align-items:center; gap:12px; cursor:pointer; min-width:0; flex-shrink:1\">\n      <img src=\"58942f77-2ca6-4957-b7b8-686386c23b50\" alt=\"Dina Melwani Couture\" style=\"height:22px; width:auto; max-width:100%; display:block; flex-shrink:1; min-width:0\">\n      <sc-if value=\"{{ L.wide }}\" hint-placeholder-val=\"{{ true }}\">\n        <span style=\"white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:0.16em; text-transform:uppercase; color:var(--pr-mute,#8A857A); padding-left:12px; border-left:1px solid var(--pr-line,#DCD6C8)\">Pattern Room<\u002Fspan>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n    <sc-if value=\"{{ L.wide }}\" hint-placeholder-val=\"{{ true }}\">\n      <div sc-camel-on-click=\"{{ goHome }}\" style=\"white-space:nowrap; font-size:13px; color:var(--pr-ink2,#57534B); cursor:pointer\">Couture 36<\u002Fdiv>\n      <sc-if value=\"{{ isProduct }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:13px; color:var(--pr-mute,#8A857A)\">/<\u002Fdiv>\n        <div style=\"white-space:nowrap; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--pr-ink,#1B1A17)\">{{ prod.code }}<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fsc-if>\n    <div style=\"flex:1; min-width:8px\"><\u002Fdiv>\n    <div title=\"{{ savedText }}\" style=\"display:flex; align-items:center; gap:8px; font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--pr-ink2,#57534B); flex-shrink:0\">\n      <span style=\"width:7px; height:7px; border-radius:50%; background:{{ savedDot }}\"><\u002Fspan>\n      <sc-if value=\"{{ L.wide }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"white-space:nowrap\">{{ savedText }}<\u002Fspan><\u002Fsc-if>\n    <\u002Fdiv>\n    <button sc-camel-on-click=\"{{ openVault }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12.5px; padding:7px 12px; border-radius:4px; border:1px solid var(--pr-line,#DCD6C8); background:transparent; color:var(--pr-ink,#1B1A17); cursor:pointer\" style-hover=\"border-color:var(--pr-ink,#1B1A17)\">{{ L.vaultLabel }}<\u002Fbutton>\n    <button sc-camel-on-click=\"{{ openSettings }}\" style=\"white-space:nowrap; flex-shrink:0; display:flex; align-items:center; gap:7px; font:inherit; font-size:12.5px; padding:7px 12px; border-radius:4px; border:1px solid var(--pr-line,#DCD6C8); background:transparent; color:var(--pr-ink,#1B1A17); cursor:pointer\" style-hover=\"border-color:var(--pr-ink,#1B1A17)\"><span style=\"width:10px; height:10px; border-radius:50%; background:var(--pr-acc,#8E2C24); box-shadow:0 0 0 2px var(--pr-surf,#FBFAF6), 0 0 0 3px var(--pr-line,#DCD6C8)\"><\u002Fspan>Settings<\u002Fbutton>\n    <sc-if value=\"{{ hasPin }}\" hint-placeholder-val=\"{{ false }}\">\n      <button sc-camel-on-click=\"{{ lockNow }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12.5px; padding:7px 12px; border-radius:4px; border:1px solid var(--pr-ink,#1B1A17); background:var(--pr-ink,#1B1A17); color:var(--pr-surf,#FBFAF6); cursor:pointer\">Lock<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fheader>\n\n  <sc-if value=\"{{ loading }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"padding:80px; text-align:center; font-family:'IBM Plex Mono',monospace; font-size:12px; color:var(--pr-mute,#8A857A)\">Opening vault…<\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ isHome }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"padding:28px {{ L.hPad }} 72px; width:100%; display:flex; flex-direction:column; gap:22px\">\n      <div style=\"display:flex; align-items:flex-end; gap:24px; flex-wrap:wrap\">\n        <div style=\"flex:1; min-width:260px; display:flex; flex-direction:column; gap:6px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--pr-acc,#8E2C24)\">Collection · SS27<\u002Fdiv>\n          <h1 style=\"margin:0; font-family:'Bodoni Moda',serif; font-weight:500; font-size:44px; line-height:1.05\">Couture 36<\u002Fh1>\n          <div style=\"font-size:14px; color:var(--pr-ink2,#57534B)\">{{ stats.total }} looks · {{ stats.withImg }} with product images · {{ stats.approved }} approved<\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:6px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Workflow for new looks<\u002Fdiv>\n          <div style=\"display:flex; border:1px solid var(--pr-line,#DCD6C8); border-radius:5px; padding:3px; background:var(--pr-surf,#FBFAF6); gap:3px\">\n            <sc-for list=\"{{ homeModes }}\" as=\"m\" hint-placeholder-count=\"2\">\n              <button sc-camel-on-click=\"{{ m.onClick }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12.5px; padding:7px 12px; border-radius:3px; border:none; cursor:pointer; background:{{ m.bg }}; color:{{ m.fg }}\">{{ m.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <label sc-camel-on-drag-over=\"{{ bulk.onDragOver }}\" sc-camel-on-drop=\"{{ bulk.onDrop }}\" style=\"display:flex; align-items:center; gap:16px; padding:14px 18px; border:1px dashed var(--pr-dash,#BDB5A3); border-radius:6px; background:var(--pr-surf,#FBFAF6); cursor:pointer\" style-hover=\"border-color:var(--pr-ink,#1B1A ont-weight:500; padding:9px 14px; border-radius:4px; border:1px solid var(--pr-ink,#1B1A17); cursor:pointer; background:{{ editBg }}; color:{{ editFg }}\">{{ editLabel }}<\u002Fbutton>\n        <\u002Fdiv>\n\n        <sc-if value=\"{{ editing }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; align-items:center; gap:10px; padding:9px 14px; background:var(--pr-accs,#F3E5E0); border:1px solid var(--pr-accb,#E2C8C0); border-radius:5px; font-size:12.5px; color:var(--pr-acct,#6E231C)\">\n            <span style=\"width:7px; height:7px; border-radius:50%; background:var(--pr-acc,#8E2C24)\"><\u002Fspan>\n            Editing — uploads, fields and removals are unlocked. Every change saves to the vault and is written to the change log.\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ genOn }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"background:var(--pr-surf,#FBFAF6); border:1px solid var(--pr-line,#DCD6C8); border-radius:6px; padding:16px 18px; display:flex; flex-direction:column; gap:9px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.14em; text-transform:uppercase; color:var(--pr-acc,#8E2C24)\">Auto-generating from images<\u002Fdiv>\n            <sc-for list=\"{{ genSteps }}\" as=\"g\" hint-placeholder-count=\"5\">\n              <div style=\"display:flex; align-items:center; gap:10px; font-size:13px; color:{{ g.fg }}\">\n                <span style=\"width:8px; height:8px; border-radius:50%; background:{{ g.dot }}\"><\u002Fspan>{{ g.label }}\n              <\u002Fdiv>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n\n        <sc-if value=\"{{ tabIs.views }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex; flex-wrap:wrap; gap:14px\">\n            <div style=\"flex:2 1 420px; min-width:0; background:var(--pr-surf,#FBFAF6); border:1px solid var(--pr-line,#DCD6C8); border-radius:6px; paddin \n              <input type=\"number\" value=\"{{ pc.ease }}\" sc-camel-on-change=\"{{ pc.onEase }}\" disabled=\"{{ notEditing }}\" style=\"font:inherit; font-size:12.5px; padding:6px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17)\">\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:4px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Inner corset<\u002Fdiv>\n              <sc-raw-select value=\"{{ pc.corsetOn }}\" sc-camel-on-change=\"{{ pc.onCorsetOn }}\" disabled=\"{{ notEditing }}\" style=\"font:inherit; font-size:12.5px; padding:6px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17)\">\n                <option value=\"no\">No<\u002Foption><option value=\"yes\">Yes — boned bodice<\u002Foption>\n              <\u002Fsc-raw-select>\n            <\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:4px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Seam allow. cm<\u002Fdiv>\n              <input type=\"number\" step=\"0.5\" value=\"{{ pc.sa }}\" sc-camel-on-change=\"{{ pc.onSa }}\" disabled=\"{{ notEditing }}\" style=\"font:inherit; font-size:12.5px; padding:6px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17)\">\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:6px\">\n            <div style=\"display:flex; gap:12px; flex-wrap:wrap; align-items:center; font-size:12px; color:var(--pr-ink2,#57534B)\">\n              <span style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.1em; text-transform:uppercase; color:var(--pr-acc,#8E2C24)\">{{ patSource }}<\u002Fspan>\n              <span>Dashed = stitch line · outer solid = cut line · shaded = seam allowance · verify scale with the 5 cm square<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"border:1px solid var(--pr-line,#DCD6C8); border-radius:6px; background:var(--pr-field,#FFFEFB); overflow:auto; max-height:74vh\">{{ patternSvg }}<\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px\">\n            <div style=\"background:var(--pr-surf,#FBFAF6); border:1px solid var(--pr-line,#DCD6C8); border-radius:6px; padding:16px 18px; display:flex; flex-direction:column; gap:8px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Pieces · {{ selSizeLabel }}<\u002Fdiv>\n              <sc-for list=\"{{ pieceRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"display:grid; grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1.2fr); gap:10px; font-size:13px; padding:6px 0; border-top:1px solid var(--pr-line2,#E6E1D5)\">\n                  <span style=\"font-weight:500\">{{ r.name }}<\u002Fspan><span style=\"color:var(--pr-ink2,#57534B)\">{{ r.cut }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; text-align:right\">{{ r.dims }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n            <div style=\"background:var(--pr-surf,#FBFAF6); border:1px solid var(--pr-line,#DCD6C8); border-radius:6px; padding:16px 18px; display:flex; flex-direction:column; gap:8px\">\n              <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Main fabric consumption · 140 cm width · est.<\u002Fdiv>\n              <sc-for list=\"{{ consRows }}\" as=\"r\" hint-placeholder-count=\"5\">\n                <div style=\"display:flex; justify-content:space-between; font-size:13px; padding:6px 0; border-top:1px solid var(--pr-line2,#E6E1D5)\">\n                  <span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px\">{{ r.label }}<\u002Fspan><span style=\"font-family:'IBM Plex Mono',monospace; font-size:12px; font-weight:500\">{{ r.m }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <div style=\"display:flex; flex-direction:column; gap:10px\">\n            <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-ink2,#57534B)\">Uploaded pattern files · real size<\u002Fdiv>\n            <sc-if value=\"{{ pf.canAdd }}\">\n              <label sc-camel-on-drag-over=\"{{ pf.onDragOver }}\" sc-camel-on-drop=\"{{ pf.onDrop }}\" style=\"display:flex; flex-direction:column; align-items:center; gap:4px; padding:26px; border:1px dashed var(--pr-dash,#BDB5A3); border-radius:6px; background:var(--pr-surf,#FBFAF6); cursor:pointer; text-align:center\" style-hover=\"border-color:var(--pr-ink,#1B1A17)\">\n                <div style=\"font-size:13.5px; font-weight:500\">Drag pattern files here or click to browse<\u002Fdiv>\n                <div style=\"font-size:12px; color:var(--pr-ink2,#57534B)\">DXF · SVG · JPG/PNG scans are identified piece-by-piece (beta) · PDF · PLT · AI stored as-is<\u002Fdiv>\n                <input type=\"file\" multiple=\"multiple\" accept=\".dxf,.plt,.hpgl,.pdf,.svg,.ai,.png,.jpg,.jpeg,.tif,.tiff\" sc-camel-on-change=\"{{ pf.onPick }}\" style=\"display:none\">\n              <\u002Flabel>\n            <\u002Fsc-if>\n            <sc-if value=\"{{ pf.empty }}\">\n              <div style=\"font-size:12.5px; color:var(--pr-mute,#8A857A)\">No pattern files uploaded er\">Download<\u002Fbutton>\n                  <sc-if value=\"{{ f.canRemove }}\"><button sc-camel-on-click=\"{{ f.onRemove }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12px; padding:6px 11px; border-radius:4px; cursor:pointer; padding:0; border:none; background:none; color:var(--pr-acc,#8E2C24)\">Remove<\u002Fbutton><\u002Fsc-if>\n                <\u002Fdiv>\n                <div style=\"display:flex; align-items:flex-end; gap:10px; flex-wrap:wrap; padding-top:10px; border-top:1px solid var(--pr-line2,#E6E1D5)\">\n                  <label style=\"display:flex; flex-direction:column; gap:3px\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Size<\u002Fspan>\n                    <sc-raw-select value=\"{{ f.sizeTag }}\" sc-camel-on-change=\"{{ f.onSizeTag }}\" disabled=\"{{ notEditing }}\" style=\"font:inherit; font-size:12.5px; padding:6px 7px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17)\"><option value=\"\">All / base<\u002Foption><option value=\"FR36\">FR36 / IT40<\u002Foption><option value=\"FR38\">FR38 / IT42<\u002Foption><option value=\"FR40\">FR40 / IT44<\u002Foption><option value=\"FR42\">FR42 / IT46<\u002Foption><option value=\"FR44\">FR44 / IT48<\u002Foption><\u002Fsc-raw-select>\n                  <\u002Flabel>\n                  <sc-if value=\"{{ f.isVec }}\">\n                    <label style=\"display:flex; flex-direction:column; gap:3px\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">File units<\u002Fspan>\n                      <sc-raw-select value=\"{{ f.units }}\" sc-camel-on-change=\"{{ f.onUnits }}\" disabled=\"{{ notEditing }}\" style=\"font:inherit; font-size:12.5px; padding:6px 7px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17)\"><option value=\"auto\">Auto-detect<\u002Foption><option value=\"mm\">mm<\u002Foption><option value=\"cm\">cm<\u002Foption><option value=\"in\">inch<\u002Foption><option value=\"px\">px (96 dpi)<\u002Foption><\u002Fsc-raw-select>\n                    <\u002Flabel>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ f.isImgId }}\">\n                    <label style=\"display:flex; flex-direction:column; gap:3px\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Scan DPI<\u002Fspan><input type=\"number\" value=\"{{ f.dpi }}\" sc-camel-on-change=\"{{ f.onDpi }}\" disabled=\"{{ notEditing }}\" placeholder=\"e.g. 300\" style=\"font:inherit; font-size:12.5px; padding:6px 7px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17); width:90px\"><\u002Flabel>\n                    <label style=\"display:flex; flex-direction:column; gap:3px\"><span style=\"font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">or image width cm<\u002Fspan><input type=\"number\" value=\"{{ f.refW }}\" sc-camel-on-change=\"{{ f.onRefW }}\" disabled=\"{{ notEditing }}\" placeholder=\"e.g. 91.4\" style=\"font:inherit; font-size:12.5px; padding:6px 7px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17); width:110px\"><\u002Flabel>\n                  <\u002Fsc-if>\n                  <sc-if value=\"{{ f.canIdentify }}\"><button sc-camel-on-click=\"{{ f.onIdentify }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12px; padding:6px 11px; border-radius:4px; cursor:pointer; border:1px solid var(--pr-acc,#8E2C24); background:var(--pr-acc,#8E2C24); color:var(--pr-surf,#FBFAF6)\">{{ f.idBtn }}<\u002Fbutton><\u002Fsc-if>\n                  <sc-if value=\"{{ f.cantIdentify }}\"><span style=\"font-size:11.5px; color:var(--pr-mute,#8A857A); max-width:320px\">PDF / AI / PLT are stored for view &amp; download. Export DXF (AAMA/ASTM) or SVG from your pattern CAD to identify pieces.<\u002Fspan><\u002Fsc-if>\n                <\u002Fdiv>\n                <sc-if value=\"{{ f.identified }}\">\n                  <div style=\"display:flex; align-items:center; gap:10px; flex-wrap:wrap\">\n                    <span style=\"flex:1; min-width:200px; font-size:12px; color:var(--pr-ink2,#57534B)\">{{ f.idSummary }}<\u002Fspan>\n                    <sc-if value=\"{{ f.unscaledWarn }}\"><span style=\"font-size:11.5px; color:var(--pr-acc,#8E2C24)\">Unscaled — enter DPI or image width, then Re-identify<\u002Fspan><\u002Fsc-if>\n                    <button sc-camel-on-click=\"{{ f.exportId }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12px; padding:6px 11px; border-radius:4px; cursor:pointer; border:1px solid var(--pr-ink,#1B1A17); background:var(--pr-ink,#1B1A17); color:var(--pr-surf,#FBFAF6)\">Export pieces SVG 1:1<\u002Fbutton>\n                  <\u002Fdiv>\n                  <div style=\"border:1px solid var(--pr-line,#DCD6C8); border-radius:5px; background:#FFFFFF; overflow:auto; max-height:320px\">{{ f.sheet }}<\u002Fdiv>\n                  <div style=\"display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr)); gap:8px\">\n                    <sc-for list=\"{{ f.pieces }}\" as=\"pc\" hint-placeholder-count=\"0\">\n                      <div style=\"display:grid; grid-template-columns:minmax(0,1fr) 54px; gap:6px; align-items:center; padding:8px; border:1px solid var(--pr-line2,#E6E1D5); border-radius:4px; background:var(--pr-field,#FFFEFB)\">\n                        <input value=\"{{ pc.name }}\" sc-camel-on-change=\"{{ pc.onName }}\" disabled=\"{{ notEditing }}\" style=\"font:inherit; font-size:12.5px; paddin r)); gap:10px\">\n            <sc-for list=\"{{ themeOpts }}\" as=\"t\" hint-placeholder-count=\"3\">\n              <button sc-camel-on-click=\"{{ t.onClick }}\" style=\"display:flex; flex-direction:column; gap:8px; padding:8px; border-radius:6px; border:2px solid {{ t.bd }}; background:transparent; cursor:pointer; text-align:left; font:inherit; color:var(--pr-ink,#1B1A17)\">\n                <div style=\"height:58px; border-radius:4px; overflow:hidden; display:grid; grid-template-columns:2fr 1fr; border:1px solid var(--pr-line,#DCD6C8)\">\n                  <div style=\"background:{{ t.page }}; display:flex; flex-direction:column; justify-content:center; gap:5px; padding:8px\">\n                    <div style=\"height:5px; width:70%; border-radius:3px; background:{{ t.ink }}\"><\u002Fdiv>\n                    <div style=\"height:5px; width:45%; border-radius:3px; background:{{ t.acc }}\"><\u002Fdiv>\n                  <\u002Fdiv>\n                  <div style=\"background:{{ t.surf }}\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"font-size:13px; font-weight:500\">{{ t.label }}<\u002Fdiv>\n              <\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Accent colour<\u002Fdiv>\n          <div style=\"display:flex; gap:14px; flex-wrap:wrap\">\n            <sc-for list=\"{{ accentOpts }}\" as=\"a\" hint-placeholder-count=\"5\">\n              <button sc-camel-on-click=\"{{ a.onClick }}\" style=\"flex-shrink:0; display:flex; flex-direction:column; align-items:center; gap:6px; padding:0; border:none; background:none; cursor:pointer; font:inherit; color:var(--pr-ink,#1B1A17); width:72px\">\n                <span style=\"width:36px; height:36px; border-radius:50%; background:{{ a. div>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ vaultOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:50; background:rgba(27,26,23,0.4); display:flex; align-items:center; justify-content:center; padding:24px\">\n      <div style=\"width:460px; max-width:100%; background:var(--pr-surf,#FBFAF6); border:1px solid var(--pr-line,#DCD6C8); border-radius:8px; padding:24px; display:flex; flex-direction:column; gap:18px; box-shadow:0 20px 50px rgba(27,26,23,0.2)\">\n        <div style=\"display:flex; align-items:flex-start; gap:12px\">\n          <div style=\"flex:1\">\n            <div style=\"font-family:'Bodoni Moda',serif; font-size:24px; font-weight:500\">Vault<\u002Fdiv>\n            <div style=\"font-size:12.5px; color:var(--pr-ink2,#57534B); margin-top:4px; text-wrap:pretty\">One source of truth: every look is stored in this browser's private database, saved on every change. Export a backup regularly.<\u002Fdiv>\n          <\u002Fdiv>\n          <button sc-camel-on-click=\"{{ closeVault }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:18px; border:none; background:none; cursor:pointer; color:var(--pr-ink2,#57534B)\">×<\u002Fbutton>\n        <\u002Fdiv>\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:11.5px; color:var(--pr-ink2,#57534B); display:flex; gap:16px; flex-wrap:wrap\"><span>{{ vaultInfo }}<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; gap:8px; flex-wrap:wrap\">\n          <button sc-camel-on-click=\"{{ exportBackup }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12.5px; padding:8px 13px; border-radius:4px; border:1px solid var(--pr-ink,#1B1A17); background:var(--pr-ink,#1B1A17); color:var(--pr-surf,#FBFAF6); cursor:pointer\">Export backup (.json)<\u002Fbutton>\n          <label style=\"font-size:12.5px; padding:8px 13px; border-radius:4px; border:1px solid var(--pr-line,#DCD6C8); color:var(--pr-ink,#1B1A17); cursor:pointer\">Restore from backup<input type=\"file\" accept=\".json,application/json\" sc-camel-on-change=\"{{ importBackup }}\" style=\"display:none\"><\u002Flabel>\n        <\u002Fdiv>\n        <div style=\"height:1px; background:var(--pr-line,#DCD6C8)\"><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:8px\">\n          <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.12em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Access PIN · {{ pinState }}<\u002Fdiv>\n          <div style=\"display:flex; gap:8px\">\n            <input type=\"password\" value=\"{{ pinNew }}\" sc-camel-on-change=\"{{ onPinNew }}\" placeholder=\"4+ digit PIN\" style=\"flex:1; font:inherit; font-size:13px; padding:8px 10px; border:1px solid var(--pr-line,#DCD6C8); border-radius:4px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17)\">\n            <button sc-camel-on-click=\"{{ setPin }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:12.5px; padding:8px 13px; border-radius:4px; border:1px solid var(--pr-ink,#1B1A17); background:transparent; color:var(--pr-ink,#1B1A17); cursor:pointer\">Set PIN<\u002Fbutton>\n          <\u002Fdiv>\n          <sc-if value=\"{{ hasPin }}\"><button sc-camel-on-click=\"{{ removePin }}\" style=\"white-space:nowrap; flex-shrink:0; align-self:flex-start; font:inherit; font-size:12px; padding:0; border:none; background:none; color:var(--pr-acc,#8E2C24); cursor:pointer\">Remove PIN<\u002Fbutton><\u002Fsc-if>\n          <div style=\"font-size:11.5px; color:var(--pr-mute,#8A857A)\">PIN is stored hashed (SHA-256). It locks this workspace on open.<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ locked }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; inset:0; z-index:80; background:var(--pr-page,#F3F0E8); display:flex; align-items:center; justify-content:center; padding:24px\">\n      <div style=\"width:340px; display:flex; flex-direction:column; gap:14px; text-align:center\">\n        <img src=\"58942f77-2ca6-4957-b7b8-686386c23b50\" alt=\"Dina Melwani Couture\" style=\"width:100%; max-width:300px; height:auto; align-self:center\">\n        <div style=\"font-family:'IBM Plex Mono',monospace; font-size:10.5px; letter-spacing:0.16em; text-transform:uppercase; color:var(--pr-mute,#8A857A)\">Pattern Room · Locked<\u002Fdiv>\n        <input type=\"password\" value=\"{{ pinIn }}\" sc-camel-on-change=\"{{ onPinIn }}\" sc-camel-on-key-down=\"{{ onPinKey }}\" placeholder=\"Enter PIN\" style=\"font:inherit; font-size:16px; text-align:center; padding:11px; border:1px solid var(--pr-line,#DCD6C8); border-radius:5px; background:var(--pr-field,#FFFEFB); color:var(--pr-ink,#1B1A17)\">\n        <button sc-camel-on-click=\"{{ unlock }}\" style=\"white-space:nowrap; flex-shrink:0; font:inherit; font-size:14px; font-weight:500; padding:11px; border-radius:5px; border:1px solid var(--pr-ink,#1B1A17); background:var(--pr-ink,#1B1A17); color:var(--pr-surf,#FBFAF6); cursor:pointer\">Unlock<\u002Fbutton>\n        <div style=\"font-size:12px; color:var(--pr-acc,#8E2C24); min-height:16px\">{{ pinErr }}<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ toastOn }}\" hint-placeholder-val=\"{{ false }}\">\n    <div style=\"position:fixed; bottom:22px; left:50%; transform:translateX(-50%); z-index:90; background:var(--pr-ink,#1B1A17); color:var(--pr-surf,#FBFAF6); font-size:13px; padding:10px 16px; border-radius:5px; box-shadow:0 8px 24px rgba(27,26,23,0.25)\">{{ toast }}<\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst SIZES=['FR36 / IT40','FR38 / IT42','FR40 / IT44','FR42 / IT46','FR44 / IT48'];\nconst SHORT=['FR36','FR38','FR40','FR42','FR44'];\nconst SIZE_COL=['#8E2C24','#B5762A','#3F7A52','#23508F','#6B4590'];\nconst POINTS=[\n ['bust','Bust','Fullest part of bust, tape level',[84,88,92,96,100],1],\n ['waist','Waist','Natural waist, narrowest point',[66,70,74,78,82],1],\n ['hip','Hip','Fullest part, ~20 cm below waist',[90,94,98,102,106],1],\n ['hipDepth','Hip depth','Waist to fullest hip, at side',[20,20,20.5,20.5,21],0.5],\n ['shoulder','Shoulder','Neck point to shoulder point',[12,12.25,12.5,12.75,13],0.3],\n ['backLen','Nape to waist','Centre back, nape to waist',[40.5,41,41.5,42,42.5],0.5],\n ['neck','Neck','Around base of neck',[35,36,37,38,39],0.5],\n ['arm','Arm length','Shoulder point to wrist, arm bent',[58.5,59,59.5,60,60.5],0.5],\n ['upperArm','Upper arm','Fullest part of upper arm',[26,27,28,29.5,31],0.5],\n ['wrist','Wrist','Around wrist bone',[15.5,16,16.5,17,17.5],0.3]];\nconst GRADE={bust:4,waist:4,hip:4,hipDepth:0.25,shoulder:0.25,backLen:0.5,neck:1,arm:0.5,upperArm:1.25,wrist:0.5};\nconst VIEWS=[['front','Front'],['back','Back'],['left','Left side'],['right','Right side'],['detail','Detail']];\nconst TABS=[['views','Product views','Front, back, both sides and a detail shot. The front view drives Auto-generate; the detail view feeds the embroidery trace.'],['flats','Technical drawing','Front and back flats generated from this look\\'s pattern features, colour and embroidery trace, beside the product photos. Change a feature in Pattern or Corset and the drawings redraw.'],['pattern','Pattern','Drafted per size from the measurement chart and shown at true centimetre scale. Upload your own real-size pattern files below.'],['corset','Corset pattern','Panelled half-corset drafted per size from bust, waist and hip with your waist reduction and lacing gap. True-scale, with busk, grommets and boning estimates.'],['measure','Measurements','Body measurements for FR36/IT40 to FR44/IT48. Edit any cell — the pattern redrafts instantly.'],['embroidery','Embroidery','Line drawings, reference images and the embroidery brief.'],['fabric','Fabric','Main, lining and interlining with composition, weight, width and c
